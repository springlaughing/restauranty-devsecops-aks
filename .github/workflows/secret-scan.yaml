# Secret scan (#13): gitleaks reads every commit in the history and fails
# if it finds something that looks like a key, password or token.
#
# Runs on every push to every branch, including pushes that change only
# docs: a key pasted into a document is still a leaked key. This is why it
# is a separate workflow: ci-cd.yaml skips docs-only pushes to main.
#
# Known old findings are accepted in .gitleaksignore, each with its reason.
#
# GitHub's own secret scanning and push protection are also on for this
# repository. They know the exact formats of many providers' keys; gitleaks
# also catches generic ones, like the Cloudinary secret it found in test 8c.

name: secret-scan

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0              # the whole history, not just the last commit
          persist-credentials: false  # no GitHub token left in .git/config

      # The image is pinned by digest: the exact bytes, which nobody can swap
      # behind the tag (see the Trivy note in ci-cd.yaml).
      # --redact hides the secret values in the log.
      - name: Scan the git history
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner -v --gitleaks-ignore-path /repo/.gitleaksignore
