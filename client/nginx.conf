server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not reveal the nginx version in responses.
    server_tokens off;

    # Single-page app: unknown paths are handled by React Router, so serve
    # index.html for anything that is not a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for the built assets (their names include a hash).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
