# Grafana's admin login, from Key Vault (#14). The same pattern as the app
# (k8s/app/*.yaml): a ServiceAccount that stands for its own Azure identity,
# a SecretStore that signs in as it, and an ExternalSecret that writes the
# Kubernetes Secret. That identity may read one Key Vault secret only:
# grafana-admin-password (terraform/cluster-access, workload "grafana").
#
# This ServiceAccount is only for External Secrets. Grafana's pod runs with
# its own ServiceAccount from the chart, which has no Azure identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # terraform -chdir=terraform/cluster-access output workload_client_ids
    azure.workload.identity/client-id: GRAFANA_CLIENT_ID
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: grafana
  namespace: monitoring
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-evgenia-restauranty.vault.azure.net
      tenantId: 84f58ce9-43c8-4932-b908-591a8a3007d3
      serviceAccountRef:
        name: grafana
---
# The Secret grafana-admin, in the shape the Grafana chart expects
# (admin.existingSecret in kube-prometheus-stack-values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: grafana
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin-password
