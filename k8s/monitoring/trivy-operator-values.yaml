# Trivy Operator (#15): scans the images that are RUNNING for known
# vulnerabilities, again whenever a new pod starts. The pipeline scans what it
# builds before the deploy (#13); this answers "is what runs now still safe?",
# also for images the pipeline never builds, such as MongoDB.
# Build log: "Why scan what is running", entry 63.
# Installed by scripts/setup-aks.sh into its own namespace, trivy-system.

# Only the app's namespace: our 4 images and MongoDB.
targetNamespaces: "restauranty"

operator:
  # Vulnerabilities only. The other scanners (configuration audit, RBAC
  # assessment, infrastructure, compliance, secrets in images) are off: each
  # adds reports and rights this project does not use yet.
  vulnerabilityScannerEnabled: true
  sbomGenerationEnabled: false
  configAuditScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false
  # One label per CVE id would make one time series per CVE: the high
  # cardinality problem of finding F18. Counts per image and severity only.
  metricsVulnIdEnabled: false
  # The chart's default lets the operator read, create and change Secrets in
  # every namespace, and use every node's kubelet API (nodes/proxy), so that
  # it can read image-pull Secrets for private registries. In filesystem mode
  # (below) the node pulls the image with its own identity, so no Secret is
  # needed: off. Same check as for the monitoring tools (build log, entry 51).
  accessGlobalSecretsAndServiceAccount: false
  scanJobsConcurrentLimit: 2          # small cluster: at most 2 scans at a time
  scanJobTTL: 10m                     # finished scan jobs are deleted after 10 minutes

# Prometheus reads the counts. The ServiceMonitor must live in monitoring:
# the Prometheus Operator watches only that namespace (build log, entry 51).
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 60s

trivy:
  # "image" would make Trivy pull each image from the registry itself, with
  # its own login. Our registry has none to give: the nodes pull with the
  # kubelet's AcrPull identity (entry 12). "filesystem" starts the image as a
  # normal container (the node pulls it) and scans its files instead.
  command: filesystem
  ignoreUnfixed: false                # report everything; the dashboard shows CRITICAL and HIGH

trivyOperator:
  # Filesystem scanning must read every file in the image, so the scan
  # container runs as root (the chart says so). Everything else stays
  # locked: no privilege escalation, no Linux capabilities, read-only file
  # system, seccomp. The scan jobs run in trivy-system, not in restauranty,
  # and stop after the scan.
  scanJobPodTemplateContainerSecurityContext:
    runAsUser: 0
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
