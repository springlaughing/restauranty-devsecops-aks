# Where Alertmanager sends alerts (#15): the Slack webhook, from Key Vault.
# The same pattern as Grafana's password (grafana-secrets.yaml, build log
# entry 52): a ServiceAccount that stands for Alertmanager's own Azure
# identity, a SecretStore that signs in as it, and an ExternalSecret that
# writes the Kubernetes Secret. That identity may read one Key Vault secret
# only: alertmanager-slack-webhook (terraform/cluster-access, workload
# "alertmanager").
#
# The webhook URL is the only key to the Slack channel: whoever has it can
# post there, including a fake "all clear" during an attack.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    # terraform -chdir=terraform/cluster-access output workload_client_ids
    azure.workload.identity/client-id: 1eff89d5-b19c-4b51-812e-5646c33ea6f2
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-evgenia-restauranty.vault.azure.net
      tenantId: 84f58ce9-43c8-4932-b908-591a8a3007d3
      serviceAccountRef:
        name: alertmanager
---
# The Secret alertmanager-slack. Alertmanager gets it as a file,
# /etc/alertmanager/secrets/alertmanager-slack/webhook-url
# (alertmanagerSpec.secrets in kube-prometheus-stack-values.yaml), and its
# config only names that file (api_url_file). So the URL is never part of
# Alertmanager's configuration, which the operator stores and which Grafana
# can show.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: alertmanager
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: alertmanager-slack-webhook
