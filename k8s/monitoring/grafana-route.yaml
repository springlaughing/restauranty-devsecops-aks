# Grafana on https://grafana.aks.springlaughing.dev, through the Gateway's
# https-grafana listener (k8s/platform/gateway.yaml). The certificate already
# covers this name. The Gateway's flood limit per IP applies here too.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: restauranty
      namespace: gateway
      sectionName: https-grafana
  hostnames:
    - grafana.aks.springlaughing.dev
  rules:
    - backendRefs:
        - name: grafana
          port: 80
