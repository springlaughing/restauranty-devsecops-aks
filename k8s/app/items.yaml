# items: menu items, dietary info, orders. Checks login tokens itself, with the JWT public key only.
#
# Hardening, the same for every app pod (the restauranty namespace enforces
# the "restricted" Pod Security profile, so a pod without it is refused):
#   - its own ServiceAccount, no Kubernetes API token mounted
#   - non-root, no privilege escalation, no Linux capabilities, seccomp on
#   - read-only root filesystem: an attacker cannot drop files into the image
#   - CPU/memory requests and a memory limit
# Secrets come from the Secret items-secrets, which holds only what this
# service needs. External Secrets fills it from Key Vault, signed in as this
# service's own Azure identity (SecretStore and ExternalSecret below).
# Reloader restarts the pods when a value in it changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: items
  namespace: restauranty
  annotations:
    # The Azure identity this ServiceAccount stands for (terraform/cluster-access,
    # output workload_client_ids). Not a secret: without the federated
    # credential in Azure, the id alone opens nothing.
    azure.workload.identity/client-id: c4cca0e5-8a35-4900-b62a-c0f6ff45bcbe
automountServiceAccountToken: false   # the pod never talks to the Kubernetes API
---
# Where items's secrets come from: Key Vault, signed in as items's own
# Azure identity. External Secrets asks Kubernetes for a short-lived token of
# the "items" ServiceAccount and trades it at Entra ID for an Azure token.
# That identity may read only the secrets listed below (role per secret).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: items
  namespace: restauranty
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-evgenia-restauranty.vault.azure.net
      tenantId: 84f58ce9-43c8-4932-b908-591a8a3007d3
      serviceAccountRef:
        name: items
---
# Fills the Secret items-secrets from Key Vault and keeps it in sync.
# If Key Vault cannot be reached, the last synced Secret stays, so the app
# keeps running (threat model, TB4: denial of service accepted).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: items-secrets
  namespace: restauranty
spec:
  refreshInterval: 1h              # a changed value in Key Vault arrives within the hour
  secretStoreRef:
    kind: SecretStore
    name: items
  target:
    name: items-secrets
    creationPolicy: Owner          # External Secrets owns the Secret: deleting this removes it
  data:
    - secretKey: mongo-password
      remoteRef:
        key: mongo-password
    - secretKey: jwt-public-key
      remoteRef:
        key: jwt-public-key
    - secretKey: cloud-name
      remoteRef:
        key: cloud-name
    - secretKey: cloud-api-key
      remoteRef:
        key: cloud-api-key
    - secretKey: cloud-api-secret
      remoteRef:
        key: cloud-api-secret
---
apiVersion: v1
kind: Service
metadata:
  name: items
  namespace: restauranty
  labels:
    app: items
spec:
  selector:
    app: items
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: items
  namespace: restauranty
  annotations:
    # Restart (rolling, no downtime) when this Secret's content changes,
    # e.g. after a password rotation in Key Vault.
    secret.reloader.stakater.com/reload: "items-secrets"
spec:
  replicas: 2                 # one pod can restart (rollout, rotation) while the other serves
  selector:
    matchLabels:
      app: items
  strategy:
    rollingUpdate:
      maxUnavailable: 0       # never fewer than 2 ready pods during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app: items
    spec:
      serviceAccountName: items
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000         # "node" user in node:22-alpine
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1            # the two pods on different nodes when possible
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: items
      containers:
        - name: items
          image: acrevgeniarestauranty.azurecr.io/items:bfb0e27
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: items-secrets
                  key: mongo-password
            # $(MONGO_PASSWORD) is filled in by Kubernetes from the variable
            # above. The password is hex, so it needs no URL escaping.
            - name: MONGODB_URI
              value: mongodb://restauranty:$(MONGO_PASSWORD)@mongodb:27017/restauranty?authSource=restauranty
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: items-secrets
                  key: jwt-public-key
            # Cloudinary (image uploads). optional: true lets the pod start
            # without them, but creating an item always uploads an image,
            # so item creation fails until the keys are in Key Vault.
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef: { name: items-secrets, key: cloud-name, optional: true }
            - name: CLOUD_API_KEY
              valueFrom:
                secretKeyRef: { name: items-secrets, key: cloud-api-key, optional: true }
            - name: CLOUD_API_SECRET
              valueFrom:
                secretKeyRef: { name: items-secrets, key: cloud-api-secret, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # The service's own "UP" route. Ready = gets traffic; live = not restarted.
          readinessProbe:
            httpGet:
              path: /api/items
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/items
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
