# auth: sign-up, login, users. The only service with the JWT private key: it is the only one that can create tokens.
#
# Hardening, the same for every app pod (the restauranty namespace enforces
# the "restricted" Pod Security profile, so a pod without it is refused):
#   - its own ServiceAccount, no Kubernetes API token mounted
#   - non-root, no privilege escalation, no Linux capabilities, seccomp on
#   - read-only root filesystem: an attacker cannot drop files into the image
#   - CPU/memory requests and a memory limit
# Secrets come from the Secret auth-secrets, which holds only what this
# service needs. External Secrets fills it from Key Vault, signed in as this
# service's own Azure identity (SecretStore and ExternalSecret below).
# Reloader restarts the pods when a value in it changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: restauranty
  annotations:
    # The Azure identity this ServiceAccount stands for (terraform/cluster-access,
    # output workload_client_ids). Not a secret: without the federated
    # credential in Azure, the id alone opens nothing.
    azure.workload.identity/client-id: 8ad76668-7ac1-4b9c-81cf-a76b7a87b872
automountServiceAccountToken: false   # the pod never talks to the Kubernetes API
---
# Where auth's secrets come from: Key Vault, signed in as auth's own
# Azure identity. External Secrets asks Kubernetes for a short-lived token of
# the "auth" ServiceAccount and trades it at Entra ID for an Azure token.
# That identity may read only the secrets listed below (role per secret).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: auth
  namespace: restauranty
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-evgenia-restauranty.vault.azure.net
      tenantId: 84f58ce9-43c8-4932-b908-591a8a3007d3
      serviceAccountRef:
        name: auth
---
# Fills the Secret auth-secrets from Key Vault and keeps it in sync.
# If Key Vault cannot be reached, the last synced Secret stays, so the app
# keeps running (threat model, TB4: denial of service accepted).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-secrets
  namespace: restauranty
spec:
  refreshInterval: 1h              # a changed value in Key Vault arrives within the hour
  secretStoreRef:
    kind: SecretStore
    name: auth
  target:
    name: auth-secrets
    creationPolicy: Owner          # External Secrets owns the Secret: deleting this removes it
  data:
    - secretKey: mongo-password
      remoteRef:
        key: mongo-password
    - secretKey: jwt-private-key
      remoteRef:
        key: jwt-private-key
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: restauranty
  labels:
    app: auth
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: restauranty
  annotations:
    # Restart (rolling, no downtime) when this Secret's content changes,
    # e.g. after a password rotation in Key Vault.
    secret.reloader.stakater.com/reload: "auth-secrets"
spec:
  replicas: 2                 # one pod can restart (rollout, rotation) while the other serves
  selector:
    matchLabels:
      app: auth
  strategy:
    rollingUpdate:
      maxUnavailable: 0       # never fewer than 2 ready pods during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app: auth
    spec:
      serviceAccountName: auth
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000         # "node" user in node:22-alpine
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1            # the two pods on different nodes when possible
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth
      containers:
        - name: auth
          image: acrevgeniarestauranty.azurecr.io/auth:bfb0e27
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: mongo-password
            # $(MONGO_PASSWORD) is filled in by Kubernetes from the variable
            # above. The password is hex, so it needs no URL escaping.
            - name: MONGODB_URI
              value: mongodb://restauranty:$(MONGO_PASSWORD)@mongodb:27017/restauranty?authSource=restauranty
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-private-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # The service's own "UP" route. Ready = gets traffic; live = not restarted.
          readinessProbe:
            httpGet:
              path: /api/auth
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
