# discounts: coupons and campaigns. Checks login tokens itself, with the JWT public key only.
#
# Hardening, the same for every app pod (the restauranty namespace enforces
# the "restricted" Pod Security profile, so a pod without it is refused):
#   - its own ServiceAccount, no Kubernetes API token mounted
#   - non-root, no privilege escalation, no Linux capabilities, seccomp on
#   - read-only root filesystem: an attacker cannot drop files into the image
#   - CPU/memory requests and a memory limit
# Secrets come from the Secret discounts-secrets, which holds only what this
# service needs. External Secrets fills it from Key Vault, signed in as this
# service's own Azure identity (SecretStore and ExternalSecret below).
# Reloader restarts the pods when a value in it changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discounts
  namespace: restauranty
  annotations:
    # The Azure identity this ServiceAccount stands for (terraform/cluster-access,
    # output workload_client_ids). Not a secret: without the federated
    # credential in Azure, the id alone opens nothing.
    azure.workload.identity/client-id: ed255711-b463-44dc-9c5c-c94d76fe1508
automountServiceAccountToken: false   # the pod never talks to the Kubernetes API
---
# Where discounts's secrets come from: Key Vault, signed in as discounts's own
# Azure identity. External Secrets asks Kubernetes for a short-lived token of
# the "discounts" ServiceAccount and trades it at Entra ID for an Azure token.
# That identity may read only the secrets listed below (role per secret).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: discounts
  namespace: restauranty
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-evgenia-restauranty.vault.azure.net
      tenantId: 84f58ce9-43c8-4932-b908-591a8a3007d3
      serviceAccountRef:
        name: discounts
---
# Fills the Secret discounts-secrets from Key Vault and keeps it in sync.
# If Key Vault cannot be reached, the last synced Secret stays, so the app
# keeps running (threat model, TB4: denial of service accepted).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discounts-secrets
  namespace: restauranty
spec:
  refreshInterval: 1h              # a changed value in Key Vault arrives within the hour
  secretStoreRef:
    kind: SecretStore
    name: discounts
  target:
    name: discounts-secrets
    creationPolicy: Owner          # External Secrets owns the Secret: deleting this removes it
  data:
    - secretKey: mongo-password
      remoteRef:
        key: mongo-password
    - secretKey: jwt-public-key
      remoteRef:
        key: jwt-public-key
---
apiVersion: v1
kind: Service
metadata:
  name: discounts
  namespace: restauranty
  labels:
    app: discounts
spec:
  selector:
    app: discounts
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discounts
  namespace: restauranty
  annotations:
    # Restart (rolling, no downtime) when this Secret's content changes,
    # e.g. after a password rotation in Key Vault.
    secret.reloader.stakater.com/reload: "discounts-secrets"
spec:
  replicas: 2                 # one pod can restart (rollout, rotation) while the other serves
  selector:
    matchLabels:
      app: discounts
  strategy:
    rollingUpdate:
      maxUnavailable: 0       # never fewer than 2 ready pods during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app: discounts
    spec:
      serviceAccountName: discounts
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000         # "node" user in node:22-alpine
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1            # the two pods on different nodes when possible
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: discounts
      containers:
        - name: discounts
          image: acrevgeniarestauranty.azurecr.io/discounts:bfb0e27
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discounts-secrets
                  key: mongo-password
            # $(MONGO_PASSWORD) is filled in by Kubernetes from the variable
            # above. The password is hex, so it needs no URL escaping.
            - name: MONGODB_URI
              value: mongodb://restauranty:$(MONGO_PASSWORD)@mongodb:27017/restauranty?authSource=restauranty
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: discounts-secrets
                  key: jwt-public-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # The service's own "UP" route. Ready = gets traffic; live = not restarted.
          readinessProbe:
            httpGet:
              path: /api/discounts
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/discounts
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
