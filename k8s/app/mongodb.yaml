# MongoDB inside the cluster, one pod, data on a zone-redundant Azure disk.
#
# Why in the cluster and not Atlas: the threat model's TB3 tests need it
# here. A NetworkPolicy can only keep an attacker pod away from a database
# that runs in the cluster (#11), and the password rotation demo (#16)
# needs admin access to change the app user's password.
#
# Two users, created on the first start only (empty disk):
#   root         admin of the whole server. Used only for admin work
#                (password rotation). No app gets this password.
#   restauranty  the apps' user: readWrite on the "restauranty" database
#                only. Cannot create users, change roles or read other
#                databases.
# Passwords come from the Secret mongodb-secrets, filled from Key Vault by
# External Secrets as MongoDB's own Azure identity (below).
# No Reloader here: MongoDB reads these passwords only on its very first
# start (empty disk). Changing a password later is done inside MongoDB
# (rotation, #16), so a restart would only cause downtime.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb
  namespace: restauranty
  annotations:
    # The Azure identity this ServiceAccount stands for (terraform/cluster-access,
    # output workload_client_ids). Not a secret: without the federated
    # credential in Azure, the id alone opens nothing.
    azure.workload.identity/client-id: 8ea73f13-8be4-4c8e-896a-b417385d06a5
automountServiceAccountToken: false   # the pod never talks to the Kubernetes API
---
# Where mongodb's secrets come from: Key Vault, signed in as mongodb's own
# Azure identity. External Secrets asks Kubernetes for a short-lived token of
# the "mongodb" ServiceAccount and trades it at Entra ID for an Azure token.
# That identity may read only the secrets listed below (role per secret).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mongodb
  namespace: restauranty
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-evgenia-restauranty.vault.azure.net
      tenantId: 84f58ce9-43c8-4932-b908-591a8a3007d3
      serviceAccountRef:
        name: mongodb
---
# Fills the Secret mongodb-secrets from Key Vault and keeps it in sync.
# If Key Vault cannot be reached, the last synced Secret stays, so the app
# keeps running (threat model, TB4: denial of service accepted).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-secrets
  namespace: restauranty
spec:
  refreshInterval: 1h              # a changed value in Key Vault arrives within the hour
  secretStoreRef:
    kind: SecretStore
    name: mongodb
  target:
    name: mongodb-secrets
    creationPolicy: Owner          # External Secrets owns the Secret: deleting this removes it
  data:
    - secretKey: root-password
      remoteRef:
        key: mongo-root-password
    - secretKey: app-password
      remoteRef:
        key: mongo-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: restauranty
data:
  # Runs once, when the data directory is empty, as the root user.
  create-app-user.js: |
    const appDb = db.getSiblingDB("restauranty");
    appDb.createUser({
      user: "restauranty",
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: "readWrite", db: "restauranty" }],
    });
    print("Created user 'restauranty' with readWrite on 'restauranty'");
---
# Headless Service: gives the pod the stable name mongodb-0.mongodb and the
# short name "mongodb" that the apps connect to.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: restauranty
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: restauranty
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      serviceAccountName: mongodb
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # the "mongodb" user in the official image
        runAsGroup: 999
        fsGroup: 999            # the disk is made writable for this group
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:8.0.34
          args: ["--auth", "--bind_ip_all"]
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: root-password
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: app-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Checks only the port, so a check never needs a password.
          readinessProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdb
              mountPath: /data/configdb
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: mongodb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi-zrs
        resources:
          requests:
            storage: 8Gi
