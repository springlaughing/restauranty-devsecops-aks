# client: NGINX serving the built React files. It only delivers files; the
# app then runs in the browser and calls /api/... on the same host. It has
# no secrets and never talks to the other services.
#
# Hardening as for the backends (see auth.yaml). NGINX writes its PID file
# and temp files to /tmp, so /tmp is the only writable place.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: restauranty
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: restauranty
  labels:
    app: client
spec:
  selector:
    app: client
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: restauranty
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: client
    spec:
      serviceAccountName: client
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # "nginx" user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: client
      containers:
        - name: client
          image: acrevgeniarestauranty.azurecr.io/client:bfb0e27
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
