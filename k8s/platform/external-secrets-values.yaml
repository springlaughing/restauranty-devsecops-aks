# External Secrets Operator: copies secrets from Key Vault into Kubernetes
# Secrets, signing in as each workload's own Azure identity (Workload
# Identity). Installed by scripts/setup-aks.sh.

installCRDs: true

# Only namespaced SecretStores, one per workload. The cluster-wide kinds are
# switched off: a ClusterSecretStore lets ExternalSecrets in ANY namespace
# read through ONE identity, which would undo the one-identity-per-service
# design.
processClusterStore: false
processClusterExternalSecret: false
processClusterPushSecret: false
processClusterGenerator: false

# PushSecret writes from the cluster INTO Key Vault. Never needed here, and
# no workload identity has write rights anyway.
processPushSecret: false
