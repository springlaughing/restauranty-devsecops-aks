# Azure disk for MongoDB's PersistentVolumeClaim (same class as the voting app).
#
# ZRS = zone-redundant storage: Azure writes every block to 3 zones. If the
# node (and with it the zone) holding MongoDB dies, the disk can be attached
# to a node in another zone. A plain (LRS) disk lives in one zone, so MongoDB
# could not move.
#
# Limit: the disk is created in the cluster's node resource group, so it is
# deleted with the cluster. The data survives pod and node failures, not a
# cluster rebuild (accepted for the demo; see SECURITY.md).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-zrs
provisioner: disk.csi.azure.com           # Azure's disk driver, built into AKS
parameters:
  skuName: StandardSSD_ZRS                # Standard SSD, replicated across 3 zones
volumeBindingMode: WaitForFirstConsumer   # create the disk only once the pod is placed
reclaimPolicy: Delete                     # deleting the PVC deletes the disk (no orphans that cost money)
allowVolumeExpansion: true
