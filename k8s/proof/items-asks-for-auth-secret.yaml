# Proof for #8 (threat model TB4, spoofing): a workload cannot read another
# workload's secret, even inside the same namespace.
#
# This ExternalSecret uses items' SecretStore (items' Azure identity) and asks
# for jwt-private-key, which only auth may read. Key Vault must refuse it.
#
#   kubectl apply -f k8s/proof/items-asks-for-auth-secret.yaml
#   kubectl get externalsecret proof-items-asks-for-private-key -n restauranty   # READY False
#   kubectl describe externalsecret proof-items-asks-for-private-key -n restauranty | grep -i forbidden
#   kubectl delete -f k8s/proof/items-asks-for-auth-secret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proof-items-asks-for-private-key
  namespace: restauranty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: items                  # signed in as items
  target:
    name: proof-should-never-exist
  data:
    - secretKey: stolen
      remoteRef:
        key: jwt-private-key     # auth's secret
